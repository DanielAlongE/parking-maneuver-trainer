name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (sim core, web, replay worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt
          POSTGRES_PASSWORD: mt
          POSTGRES_DB: mt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_WORKER_DATABASE_URL: postgresql://mt:mt@localhost:5432/mt
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mt/web build

  python:
    name: Python (sim twin parity, API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt
          POSTGRES_PASSWORD: mt
          POSTGRES_DB: mt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mt:mt@localhost:5432/mt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sim twin matches golden vectors
        working-directory: packages/sim-py
        run: uv run pytest
      - name: API tests
        working-directory: apps/api
        run: uv run pytest

  golden-vectors-fresh:
    name: Golden vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm golden:generate
      - name: Fail if regenerating changed the committed vectors
        run: git diff --exit-code packages/golden-vectors/expected

  browser-parity:
    name: Golden vectors in ${{ matrix.browser }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: firefox }
          - { os: ubuntu-latest, browser: webkit }
          - { os: macos-latest, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mt/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @mt/web exec playwright test --project=${{ matrix.browser }}

  engine-parity:
    name: Golden vectors in engine shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, engines: "node jsc gjs" }
          - { os: macos-latest, engines: "node jsc" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install JavaScriptCore and SpiderMonkey shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjavascriptcoregtk-bin gjs
      - run: bash packages/sim-core/scripts/run-engines.sh ${{ matrix.engines }}

  migrations:
    name: Database migrations apply and are idempotent
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt
          POSTGRES_PASSWORD: mt
          POSTGRES_DB: mt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mt:mt@localhost:5432/mt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: apps/api
        run: |
          uv run python -m mt_api.cli migrate
          uv run python -m mt_api.cli migrate | grep "none (up to date)"

  end-to-end:
    name: End-to-end workflow in Chromium
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt
          POSTGRES_PASSWORD: mt
          POSTGRES_DB: mt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mt:mt@localhost:5432/mt
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mt/web exec playwright install --with-deps chromium
      - run: bash scripts/e2e.sh
      - name: Keep logs and traces when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            .e2e-logs
            apps/web/test-results
