[project]
name = "mt-sim"
version = "0.1.0"
description = "Python twin of the maneuver simulator core, held bit-identical to @mt/sim-core by golden test vectors"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
