[project]
name = "mt-api"
version = "0.1.0"
description = "Maneuver Trainer API: tasks, submissions, reviews and points"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mt-sim",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv.sources]
mt-sim = { path = "../../packages/sim-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
